<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Harmonic Oscillator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: black; color: #00FFAA; text-align: center; font-family: "Courier New", monospace; }
        .container { width: 80%; margin: auto; padding-top: 20px; }
        canvas { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .buttons { margin-top: 20px; }
        button { 
            background: linear-gradient(45deg, #00FFAA, #008a5c); 
            border: none; 
            padding: 10px 20px; 
            font-size: 18px; 
            cursor: pointer; 
            margin: 10px; 
            border-radius: 5px; 
            transition: 0.3s; 
        }
        button:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quantum Harmonic Oscillator</h1>
        <h3>Wave Function Visualization</h3>
        <canvas id="qhoGraph"></canvas>
        <div class="buttons">
            <button onclick="changeState(-1)">Decrease n</button>
            <span id="nValue">n = 0</span>
            <button onclick="changeState(1)">Increase n</button>
        </div>
    </div>

    <script>
        let n = 0;
        const ctx = document.getElementById("qhoGraph").getContext("2d");

        let chart = new Chart(ctx, {
            type: "line",
            data: { 
                labels: [], 
                datasets: [{
                    label: "ψ(n, x)", 
                    data: [], 
                    borderColor: "#00FFAA", 
                    borderWidth: 2 
                }] 
            },
            options: { 
                responsive: true,
                scales: { 
                    x: { beginAtZero: false }, 
                    y: { beginAtZero: false } 
                } 
            }
        });

        // 🔥 UPDATED FOR VERCEL SERVERLESS API
        function fetchWaveData(n) {
            fetch(`/api/wave?n=${n}`)
                .then(response => response.json())
                .then(data => {
                    console.log("Fetched Data:", data);

                    if (!data.x || !data.y) {
                        throw new Error("Invalid data format");
                    }

                    chart.data.labels = data.x;
                    chart.data.datasets[0].data = data.y;
                    chart.update();

                    document.getElementById("nValue").innerText = `n = ${n}`;
                })
                .catch(error => console.error("Error fetching data:", error));
        }

        function changeState(delta) {
            n = Math.max(0, n + delta);
            fetchWaveData(n);
        }

        // Load initial graph
        fetchWaveData(n);
    </script>
</body>
</html>
