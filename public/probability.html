<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Harmonic Oscillator</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: Arial, sans-serif; 
            background-color: #1e1e2f; 
            color: #ffffff; 
            padding: 20px;
        }
        h1 { color: #4db8ff; }
        .formula {
            background: #2b2b3c;
            border: 2px solid #4db8ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            width: 80%;
            text-align: center;
        }
        .controls {
            margin-bottom: 20px;
        }
        .controls label {
            margin-right: 10px;
        }
        #graph {
            width: 90%;
            height: 500px;
        }
        footer {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .footer-logo {
            height: 50px;
        }
        .home-button {
            position: relative;
            overflow: hidden;
            background: transparent;
            border: 2px solid #4db8ff;
            color: #4db8ff;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }
        .home-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #4db8ff;
            transition: left 0.4s ease-in-out;
            z-index: 0;
        }
        .home-button:hover::before {
            left: 0;
        }
        .home-button span {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <h1>Quantum Harmonic Oscillator Visualization</h1>
    <div class="formula">
        Probability Density: 
        <b>ψ<sub>n</sub>(x) = (1 / √(2<sup>n</sup>n!√π)) e<sup>-x²/2</sup> H<sub>n</sub>(x)</b>
    </div>

    <div class="controls">
        <label for="n-value">Select n-value:</label>
        <input type="range" id="n-value" min="0" max="10" value="0" step="1">
        <span id="n-label">n = 0</span>
    </div>

    <div id="graph"></div>

    <footer>
        <img src="mylogo.jpeg" alt="Logo" class="footer-logo">
        <a href="landing.html" class="home-button"><span>Back to Home</span></a>
    </footer>

    <script>
        function hermitePolynomial(n, x) {
            if (n === 0) return [1];
            if (n === 1) return [2 * x];
            let Hn_1 = [2 * x];
            let Hn_2 = [1];
            for (let i = 2; i <= n; i++) {
                const Hn = Hn_1.map((val, idx) => 2 * x * val).map((val, idx) => idx < Hn_2.length ? val - 2 * (i - 1) * Hn_2[idx] : val);
                Hn_2 = Hn_1;
                Hn_1 = Hn;
            }
            return Hn_1;
        }

        function waveFunction(n, x) {
            const Hn = hermitePolynomial(n, x);
            const normalization = 1 / Math.sqrt(Math.pow(2, n) * factorial(n) * Math.sqrt(Math.PI));
            return normalization * Math.exp(-(x ** 2) / 2) * Hn[0];
        }

        function factorial(num) {
            return num <= 1 ? 1 : num * factorial(num - 1);
        }

        function plotGraph(n) {
            const x = Array.from({ length: 500 }, (_, i) => -4 + (i / 500) * 8);
            const y = x.map(val => Math.pow(waveFunction(n, val), 2));

            const trace = {
                x: x,
                y: y,
                mode: 'lines',
                line: { color: '#4db8ff', width: 3 },
                fill: 'tozeroy',
                name: `n = ${n}`
            };

            const layout = {
                title: `Probability Density for n = ${n}`,
                paper_bgcolor: '#1e1e2f',
                plot_bgcolor: '#1e1e2f',
                xaxis: { color: '#ffffff', title: 'Position (x)' },
                yaxis: { color: '#ffffff', title: 'Probability Density' },
                transition: { duration: 1000, easing: 'ease-in-out' }
            };

            Plotly.newPlot('graph', [trace], layout);
        }

        document.getElementById('n-value').addEventListener('input', function () {
            const n = parseInt(this.value, 10);
            document.getElementById('n-label').textContent = `n = ${n}`;
            plotGraph(n);
        });

        plotGraph(0); // Default graph for n = 0
    </script>
</body>
</html>
