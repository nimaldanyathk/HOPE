<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Tools</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.fog.min.js"></script>
    <style>
        body {
            background-color: #0A0A0A;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        #vanta-bg {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            background: rgba(44, 44, 44, 0.8);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }

        .scroll-container {
            overflow: hidden;
            width: 100%;
            white-space: nowrap;
            padding: 10px 0;
        }

        .scrolling-bar {
            display: flex;
            gap: 40px;
            animation: scroll 20s linear infinite;
        }

        .scrolling-bar img {
            height: 60px;
            transition: transform 0.3s ease-in-out;
        }

        .scrolling-bar img:hover {
            transform: scale(1.1);
        }

        @keyframes scroll {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        .scroll-bar-1 { animation-duration: 22s; }
        .scroll-bar-2 { animation-duration: 25s; }
    </style>
</head>
<body>
    <div id="vanta-bg"></div>
    <h2>Tools Used in This Project</h2>

    <div class="container">
        <div class="scroll-container">
            <div class="scrolling-bar scroll-bar-1">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JavaScript">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="HTML">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" alt="CSS">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Three.js_Icon.svg" alt="Three.js">
                <img src="canva.com-7.png" alt="Canva">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/flask/flask-original.svg" alt="Flask">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/ed/Pandas_logo.svg" alt="Pandas">
            </div>
        </div>

        <div class="scroll-container">
            <div class="scrolling-bar scroll-bar-2">
                <img src="matplot_title_logo.png" alt="DeepSeek">
                <img src="scipy.png" alt="OpenAI">
                <img src="deepseek.png" alt="DeepSeek">
                <img src="openai.png" alt="OpenAI">
                
            </div>
        </div>
    </div>

    <script>
        VANTA.FOG({
            el: "#vanta-bg",
            highlightColor: 0x202020,
            midtoneColor: 0x101010,
            lowlightColor: 0x000000,
            baseColor: 0x0a0a0a,
            blurFactor: 0.9,
            speed: 1.5,
            zoom: 1
        });
    </script>
</body>
</html>
