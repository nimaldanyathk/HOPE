<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Probability Density Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0A0A0A; }
        canvas { display: block; }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="info">Use the sliders to change quantum state (n) and explore probability densities.</div>

<script>
    let scene, camera, renderer, controls;
    let waveMesh, probabilityMesh;
    let time = 0;

    // Initialize Scene
    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 8);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Quantum Parameters
        const quantumParams = { n: 1 };

        // Wave Function Geometry
        const waveGeom = new THREE.PlaneGeometry(6, 3, 100, 100);
        const waveMat = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vPos;
                uniform float time;
                uniform float n;
                void main() {
                    vPos = position;
                    float x = position.x;
                    float psi = sin(n * 3.1415 * x / 3.0) * cos(time * 2.0);
                    vec3 newPos = position + vec3(0.0, psi * 0.4, 0.0);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vPos;
                void main() {
                    float intensity = 0.5 + 0.5 * sin(vPos.x * 3.0);
                    gl_FragColor = vec4(intensity, 0.5, 1.0, 1.0);
                }
            `,
            uniforms: {
                time: { value: 0 },
                n: { value: quantumParams.n }
            },
            transparent: true
        });

        waveMesh = new THREE.Mesh(waveGeom, waveMat);
        waveMesh.rotation.x = -Math.PI / 2;
        scene.add(waveMesh);

        // Probability Density (Visualizing |Ψ|²)
        const probGeom = new THREE.PlaneGeometry(6, 3, 100, 100);
        const probMat = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vPos;
                uniform float n;
                void main() {
                    vPos = position;
                    float x = position.x;
                    float psi = pow(sin(n * 3.1415 * x / 3.0), 2.0);
                    vec3 newPos = position + vec3(0.0, psi * 1.2, 0.0);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vPos;
                void main() {
                    float intensity = 0.2 + 0.8 * vPos.y;
                    gl_FragColor = vec4(1.0, intensity, 0.2, 1.0);
                }
            `,
            uniforms: {
                n: { value: quantumParams.n }
            },
            transparent: true
        });

        probabilityMesh = new THREE.Mesh(probGeom, probMat);
        probabilityMesh.rotation.x = -Math.PI / 2;
        probabilityMesh.position.y = -1;
        scene.add(probabilityMesh);

        // GUI for Interaction
        const gui = new dat.GUI();
        gui.add(quantumParams, 'n', 1, 5, 1).name("Quantum State (n)").onChange((value) => {
            waveMat.uniforms.n.value = value;
            probMat.uniforms.n.value = value;
        });

        animate();
    }

    // Animation Loop
    function animate() {
        time += 0.02;
        waveMesh.material.uniforms.time.value = time;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
    });

    init();
</script>

</body>
</html>
